[package]
name = "gat-sp1-beam"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[[bin]]
name = "gat-sp1-beam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gat-sp1-beam-lib = { path = "../lib" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sp1-sdk = { version = "=6.5.0", features = ["blocking"] }

[build-dependencies]
sp1-build = { version = "=6.5.0" }
