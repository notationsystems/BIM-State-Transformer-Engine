[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gat-bim"
version = "0.1.0"
description = "A decision-focused, uncertainty-aware computational state engine for BIM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Notation Systems" }]
keywords = ["BIM", "IFC", "gaussian", "uncertainty", "compiler", "architecture", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.scripts]
gat = "gat.cli:main"
gat-headless = "gat.headless:main"
gat-ifc-audit = "gat.cli:ifc_audit_main"

[project.optional-dependencies]
openusd = ["usd-core>=26.8,<27", "cryptography>=40"]

[project.urls]
Repository = "https://github.com/notationsystems/GAT-Gaussian-Architectural-Transformer-for-BIM"

[tool.setuptools.packages.find]
include = ["gat*"]

[tool.setuptools.package-data]
"gat.demo" = ["model.ifc"]
