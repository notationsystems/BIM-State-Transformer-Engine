[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gat-bim"
version = "0.1.0"
description = "GAT — Gaussian Architectural Transformer: a computational compiler for transforming, propagating, and reasoning over BIM state using Gaussian representations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Notation Systems" }]
keywords = ["BIM", "IFC", "gaussian", "uncertainty", "compiler", "architecture", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/notationsystems/GAT-Gaussian-Architectural-Transformer-for-BIM"

[tool.setuptools.packages.find]
include = ["gat*"]

[tool.setuptools.package-data]
"gat.demo" = ["model.ifc"]
